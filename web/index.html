<!doctype html>

<title>Strudel</title>

<h1>Strudel</h1>
<p>Write in Emacs or an Org source block. Audio starts automatically. Use Enable audio if WebKit asks for a click.</p>
<button id="enable" disabled>Enable audio</button>
<button id="stop">Stop</button>
<p id="state" role="status">Loading local runtime…</p>
<pre id="error" role="alert"></pre>
<p>Local samples: <span id="samples">loading…</span></p>
